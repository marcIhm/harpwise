AllCops:
  NewCops: enable
  TargetRubyVersion: 3.2
  DisabledByDefault: true

Layout:
  Enabled: true
Style:
  Enabled: true
Lint:
  Enabled: true

# This breaks: "foo %s %s %s" % %w(bar baz qux)
Style/FormatString:
  Enabled: false
  
Style/GlobalVars:
  Enabled: false
Layout/EmptyLines:
  Enabled: false
Style/MethodDefParentheses:
  Enabled: false
Layout/SpaceInsideParens:
  Enabled: false
Style/StringConcatenation:
  Enabled: false
Naming/MethodParameterName:
  Enabled: false
Layout/SpaceInsideBlockBraces:
  Enabled: false
Layout/ExtraSpacing:  
  Enabled: false
Style/NumericPredicate:
  Enabled: false
Style/EmptyLiteral:
  Enabled: false
Layout/EmptyLinesAroundBeginBody:
  Enabled: false
Lint/Loop:
  Enabled: false
Layout/LineLength:
  Enabled: false
Lint/AmbiguousOperatorPrecedence:
  Enabled: false